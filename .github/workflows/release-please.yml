name: Release Please

on:
    push:
        branches:
            - main

permissions:
    contents: write
    pull-requests: write
    # `actions: write` lets the job dispatch ci.yml onto the release PR branch.
    actions: write

jobs:
    release-please:
        runs-on: ubuntu-latest
        outputs:
            release_created: ${{ steps.release.outputs.release_created }}
            version: ${{ steps.release.outputs['.--version'] }}
        steps:
            -   uses: googleapis/release-please-action@v4
                id: release
                with:
                    config-file: release-please-config.json
                    manifest-file: .release-please-manifest.json

            # release-please pushes its release PR via GITHUB_TOKEN, and (by
            # GitHub's anti-recursion rule) GITHUB_TOKEN pushes do NOT trigger
            # `pull_request` CI — so the release PR never gets checks on its
            # own. API-triggered `workflow_dispatch` is the documented
            # exception to that rule: dispatch ci.yml onto the PR branch so
            # its check runs (including the required `ci-gate`) attach to the
            # PR head SHA natively — live jobs on the PR, no status plumbing,
            # and no stale-SHA race against the force-push.
            -   name: Dispatch CI for the release PR
                if: ${{ steps.release.outputs.prs_created == 'true' && steps.release.outputs.release_created != 'true' }}
                env:
                    GH_TOKEN: ${{ github.token }}
                    PRS_OUTPUT: ${{ steps.release.outputs.prs }}
                run: |
                    branch=$(jq -r '.[0].headBranchName // empty' <<< "$PRS_OUTPUT")
                    if [[ -z "$branch" ]]; then
                        echo "no release PR branch in prs output; skipping"
                        exit 0
                    fi
                    gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$branch"
                    echo "dispatched ci.yml on $branch"

    # When release-please cuts a release (on merge of its PR), build + push the
    # api/worker/fe images to GHCR tagged with the new version. This runs inline
    # in the same workflow run — a `release`-triggered workflow would never fire
    # because release-please publishes the release via GITHUB_TOKEN.
    publish-images:
        needs: release-please
        if: ${{ needs.release-please.outputs.release_created == 'true' }}
        permissions:
            contents: read
            packages: write
        uses: ./.github/workflows/docker-publish.yml
        with:
            version: ${{ needs.release-please.outputs.version }}
