# Server-side mirror of the SPA's locale normalizer: bare public paths
# redirect to the visitor's preferred locale variant so crawlers and
# no-JS scrapers (which never run the router) still land on a
# prerendered, correct-locale page. German browsers get `/de`,
# everything else `/en` — same default chain the FE uses.
map $http_accept_language $preferred_locale {
    default en;
    ~*^de   de;
}

server {
    listen 8080;
    listen [::]:8080;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # ---- Compression ----
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript
               application/x-javascript application/xml application/javascript
               application/json image/svg+xml application/manifest+json;

    # ---- Baseline security headers ----
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    # `no-referrer`: never send a Referer header. Browser-facing one-time
    # token pages (/auth/consume?token=…, invite / owner-transfer /
    # email-change links) would otherwise leak the full URL — token included
    # — as the Referer on the same-origin API call (and into any upstream
    # log). The app has no need for referrer data, so the strongest policy
    # is also the cheapest.
    add_header Referrer-Policy "no-referrer" always;

    # ---- Asset caching ----
    # Vite emits hashed filenames in /assets/*-[hash].(js|css|webp|png|...).
    # Those are immutable: changing the source changes the hash, which
    # changes the URL, which forces a fresh fetch. Year-long immutable
    # cache is safe. ALL user-visible imagery (sloth-*.webp,
    # sloth-family-960.webp, tree-example-*.webp, og-1200x630.png) lives
    # here — the components import them from `@/assets/brand/` so Vite
    # bundles + hashes the URL at build time.
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # The brand directory holds only the NON-hashed favicons + apple-touch
    # icon (`favicon-{16,32,48}.png`, `favicon.ico`, `apple-touch-icon.png`).
    # Their URLs are hardcoded in index.html `<link>` tags, so they can't
    # be content-hashed without rewriting index.html from a Vite plugin.
    # One-hour cache + must-revalidate keeps a favicon refresh visible
    # within a tight window without burning the year-long cache the
    # hashed bundles enjoy.
    location ^~ /brand/ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600, must-revalidate" always;
        try_files $uri =404;
    }

    # Sitemap + robots — frequently fetched by crawlers; short cache so
    # updates roll out quickly without per-request lookups. These are real
    # static files (emitted by generate-sitemap.js) served BEFORE the
    # locale-prefix rules below, so they are never redirected into the
    # SPA's locale space. Each sitemap is emitted plain + gzipped; the
    # `.xml.gz` variants carry `Content-Encoding: gzip` so a client that
    # requests them gets a correctly-decoded XML document.
    location = /sitemap.xml      { add_header Cache-Control "public, max-age=3600"; }
    location = /sitemap_en.xml   { add_header Cache-Control "public, max-age=3600"; }
    location = /sitemap_de.xml   { add_header Cache-Control "public, max-age=3600"; }
    location ~ ^/sitemap(_(en|de))?\.xml\.gz$ {
        types { } default_type application/xml;
        add_header Content-Encoding gzip;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }
    location = /robots.txt       { add_header Cache-Control "public, max-age=3600"; }

    # ---- Public pages: locale-prefixed + prerendered ----
    # Canonicalize trailing-slash variants of the public URLs FIRST:
    # `dist/en/` exists as a real directory (it holds the nested legal
    # pages), so without this `/en/` falls into directory handling — no
    # index file → 403 — and `/en/imprint/` serves the SPA shell WITHOUT
    # the X-Robots-Tag below. One permanent redirect to the slash-less
    # canonical keeps crawlers on the prerendered pages.
    rewrite ^/((?:en|de)(?:/(?:imprint|data-policy))?)/$ /$1 permanent;

    # Bare public paths redirect to the preferred-locale variant (the
    # FE's catch-all normalizer does the same client-side; this mirror
    # serves crawlers + scrapers that never run JS). Old emailed links
    # with query strings keep them: `$is_args$args` re-appends the token.
    location = /            { return 302 /$preferred_locale$is_args$args; }
    location = /imprint     { return 302 /$preferred_locale/imprint$is_args$args; }
    location = /data-policy { return 302 /$preferred_locale/data-policy$is_args$args; }

    # Prerendered home variants (vite-ssg emits flat `en.html`/`de.html`).
    # `no-cache` like the SPA shell: the content changes per deploy and
    # carries the hashed asset URLs.
    location = /en {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files /en.html /index.html;
    }
    location = /de {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files /de.html /index.html;
    }

    # Prerendered legal pages. They must NOT be indexed: `X-Robots-Tag`
    # is the HTTP-level mirror of each page's
    # `<meta name="robots" content="noindex,nofollow">` — defence in
    # depth in case the meta tag is ever stripped by a proxy.
    location ~ ^/(en|de)/(imprint|data-policy)$ {
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri.html /index.html;
    }

    # The SPA shell. `no-cache` on `index.html` so the browser always
    # re-checks for new hashed-asset URLs inside; the asset URLs change
    # whenever source changes, so the immutable cache above + a fresh
    # index.html together force the right fetches without ever serving
    # stale code. Everything not matched above — `/en/tree`, bare app
    # paths, old emailed token links — lands here and the client router
    # normalizes the locale prefix (query strings survive untouched).
    location / {
        try_files $uri $uri/ /index.html;
    }
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        expires off;
    }

    # Liveness probe — same path the API uses, so an upstream LB can
    # treat both services identically.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "OK";
    }
}
